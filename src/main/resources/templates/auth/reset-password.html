<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Đặt lại mật khẩu</h1>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>
            <div>
                <label>Email</label>
                <input type="email" th:field="*{email}" readonly style="background: #f1f5f9;">
            </div>
            <div>
                <label>Mã OTP</label>
                <input type="text" name="otp" maxlength="6" required autofocus placeholder="Nhập mã OTP 6 số" style="letter-spacing: 3px; text-align: center;">
            </div>
            <div>
                <label>Mật khẩu mới</label>
                <input type="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự">
                <small class="error-text" th:errors="*{password}"></small>
            </div>
            <div>
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới">
                <small class="error-text" th:errors="*{confirmPassword}"></small>
            </div>

            <button class="button full" type="submit">Cập nhật mật khẩu</button>
        </form>

        <p><a th:href="@{/login}">Quay lại Đăng nhập</a></p>
    </div>
</div>
</body>
</html>
