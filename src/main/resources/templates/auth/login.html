<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Đăng nhập</h1>

        <div th:if="${param.error}" class="alert error">
            Sai tên đăng nhập/email hoặc mật khẩu!
        </div>
        <div th:if="${param.logout}" class="alert success">
            Bạn đã đăng xuất thành công.
        </div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div>
                <label for="username">Username hoặc Email</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Nhập username hoặc email">
            </div>
            <div>
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu">
            </div>

            <button class="button full" type="submit">Đăng nhập</button>
        </form>

        <p>Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
        <p><a th:href="@{/forgot-password}">Quên mật khẩu?</a></p>
    </div>
</div>
</body>
</html>
