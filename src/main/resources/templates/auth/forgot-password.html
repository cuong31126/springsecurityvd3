<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Quên mật khẩu</h1>

        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
            <div>
                <label>Email đã đăng ký</label>
                <input type="email" th:field="*{email}" placeholder="example@gmail.com" required autofocus>
                <small class="error-text" th:errors="*{email}"></small>
            </div>

            <button class="button full" type="submit">Gửi mã OTP đặt lại mật khẩu</button>
        </form>

        <p><a th:href="@{/login}">Quay lại Đăng nhập</a></p>
    </div>
</div>
</body>
</html>
