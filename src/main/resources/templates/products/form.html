<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm Product' : 'Sửa Product'})}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <div style="max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
        <h1 style="font-size: 1.5rem; margin-bottom: 20px;" th:text="${mode == 'create' ? 'Thêm Sản phẩm mới' : 'Cập nhật Sản phẩm'}"></h1>

        <form th:object="${productDTO}" method="post" enctype="multipart/form-data" accept-charset="UTF-8"
              th:action="${mode == 'create'} ? @{/products/create} : @{'/products/edit/' + *{id}}">

            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <input type="hidden" th:field="*{id}">

            <div>
                <label for="name">Tên sản phẩm</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Nhập tên sản phẩm">
                <small class="error-text" th:errors="*{name}"></small>
            </div>

            <div>
                <label for="description">Mô tả sản phẩm</label>
                <textarea id="description" th:field="*{description}" rows="4" placeholder="Nhập mô tả sản phẩm..."></textarea>
                <small class="error-text" th:errors="*{description}"></small>
            </div>

            <div>
                <label for="price">Giá bán (VNĐ)</label>
                <input id="price" type="number" step="0.01" th:field="*{price}" placeholder="0.00">
                <small class="error-text" th:errors="*{price}"></small>
            </div>

            <div>
                <label for="image">Hình ảnh sản phẩm (Upload Cloudinary)</label>
                <input id="image" type="file" name="image" accept="image/*">
                <div th:if="${productDTO.imageUrl != null and !#strings.isEmpty(productDTO.imageUrl)}" style="margin-top: 10px;">
                    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 5px;">Ảnh hiện tại:</p>
                    <img th:src="${#strings.contains(productDTO.imageUrl, '|') ? #strings.substringBefore(productDTO.imageUrl, '|') : productDTO.imageUrl}"
                         class="thumb" style="width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0;" alt="Current image">
                </div>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button type="submit" class="button">Lưu sản phẩm</button>
                <a th:href="@{/products}" class="button secondary">Hủy</a>
            </div>
        </form>
    </div>
</main>
</div>
</body>
</html>
