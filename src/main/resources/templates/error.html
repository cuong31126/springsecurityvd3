<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Lỗi')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main style="text-align: center; padding: 60px 20px;">
    <h1 style="font-size: 3rem; color: #ef4444; margin-bottom: 15px;" th:text="${status != null ? 'Lỗi ' + status : 'Oops!'}">Oops!</h1>
    <p style="font-size: 1.2rem; color: #475569; margin-bottom: 15px; font-weight: 500;" th:text="${message}"></p>
    <p th:if="${uri != null}" style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 25px;">
        Đường dẫn: <code style="background: #f1f5f9; padding: 4px 8px; border-radius: 4px;" th:text="${uri}"></code>
    </p>
    <a th:href="@{/}" class="button">Quay lại Trang chủ</a>
</main>
</div>
</body>
</html>
